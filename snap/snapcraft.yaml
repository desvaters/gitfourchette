# -----------------------------------------------------------------------------
# Snap recipe for GitFourchette.
# See snap/README.md for build instructions, measurements and limitations.
#
# Note: snapcraft insists on finding its recipe in ./snap, ./build-aux/snap
# or the project root, so this doesn't live in ./pkg like the other packaging
# boilerplate.
# -----------------------------------------------------------------------------

name: gitfourchette
adopt-info: gitfourchette  # picks up the version from APP_VERSION (see override-build)
summary: The comfortable Git UI
description: |
  Explore your repos easily. Craft commits intuitively. GitFourchette will
  become your new home to get work done in your Git repositories.

  - A comfortable way to explore and understand your Git repositories
  - Powerful tools to stage code, create commits, and manage branches
  - Snappy and intuitive Qt UI designed to fit in snugly with KDE Plasma

license: GPL-3.0-or-later
website: https://gitfourchette.org
contact: https://github.com/jorio/gitfourchette/issues
issues: https://github.com/jorio/gitfourchette/issues
source-code: https://github.com/jorio/gitfourchette
title: GitFourchette
icon: snap/gui/gitfourchette.png

# core26 rather than core24: a classic snap can't use a content snap for Qt,
# so Qt has to be staged from the distribution -- and only 26.04 (Plasma 6)
# ships a Qt6 Breeze style. See snap/README.md for the measurements.
base: core26
grade: stable

# GitFourchette is a developer tool that drives host tooling: user-configured
# git hooks, credential helpers, external editors, terminals and merge tools.
# None of that is reachable from a sandbox, and there is no snap equivalent
# of flatpak-spawn --host.
confinement: classic

platforms:
  amd64:
  arm64:

apps:
  gitfourchette:
    command: bin/gitfourchette
    common-id: org.gitfourchette.gitfourchette
    environment:
      # PyQt6 comes from the distribution, which installs into dist-packages
      # rather than into the venv this part builds.
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages
      # Where the staged Qt6 plugins live, including the Breeze widget style.
      QT_PLUGIN_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins
      # $SNAP/bin first: the entry point's shebang is "/usr/bin/env python3",
      # and it has to find the venv's interpreter. The staged distribution
      # interpreter in $SNAP/usr/bin knows nothing about the venv, so putting
      # that first makes the app fail with ModuleNotFoundError.
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
      # git is bundled and built for /usr, so point it at its helpers.
      GIT_EXEC_PATH: $SNAP/usr/lib/git-core
      GIT_TEMPLATE_DIR: $SNAP/usr/share/git-core/templates
      # Deliberately NOT setting LD_LIBRARY_PATH: under classic confinement the
      # app spawns host programs, and they would inherit it and try to load our
      # Qt. Library lookup is handled by patchelf/RPATH instead (see the parts).

parts:
  gitfourchette:
    plugin: python
    source: .
    source-type: local
    # The python plugin looks for the interpreter in $CRAFT_STAGE/usr/bin,
    # so the python part has to be staged before this one builds.
    after: [python]
    build-attributes: [enable-patchelf]
    python-packages:
      - pip
      - setuptools
      - wheel
    build-packages:
      - python3-dev
      - python3-venv    # core26's build environment doesn't ship ensurepip
      - python3-pygit2  # update_resources.py imports pygit2
    override-build: |
      # Upstream asks for this on every distributed build: it stamps the commit,
      # date and Qt binding into appconsts.py. Must run before the install step.
      # pygit2 comes from the build-package, which installs into the system's
      # dist-packages -- invisible to the venv this part builds in.
      PYTHONPATH=/usr/lib/python3/dist-packages python3 update_resources.py --freeze pyqt6
      craftctl default
      craftctl set version="$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' gitfourchette/appconsts.py)"

  python:
    # Classic confinement forbids using the base's interpreter, and core26
    # doesn't ship one anyway -- so bring our own. This has to be a separate
    # part: staging it alongside the python plugin makes the venv collide with
    # the staged bin/python3.
    plugin: nil
    build-attributes: [enable-patchelf]
    stage-packages:
      - python3
      # Once this part is staged, its interpreter shadows the build
      # environment's one on PATH, and the python plugin creates the venv with
      # it -- so it needs ensurepip too. (PARTS_PYTHON_INTERPRETER can't help:
      # the plugin concatenates it onto a directory, so it must stay a bare
      # name.)
      - python3-venv

  qt:
    # Qt, the PyQt6 bindings and the Breeze style all come from the same Ubuntu
    # release, so their ABI matches by construction. This is what the PyPI
    # wheels could not offer: they bundle their own Qt, which knows nothing
    # about Breeze.
    #
    # The Qt plugins are deliberately excluded here and staged by qt-plugins
    # instead -- see the comment there for why they must not be patched by
    # snapcraft.
    plugin: nil
    build-attributes: [enable-patchelf]
    stage-packages:
      - python3-pyqt6
      - python3-pyqt6.qtsvg  # the distribution splits PyQt6 up per Qt module
      - kde-style-breeze
      - qt6-wayland
    stage:
      - -usr/lib/*/qt6/plugins

  qt-plugins:
    # Same packages as the qt part, but only the plugins, and NOT patched by
    # snapcraft.
    #
    # snapcraft 9.0.1 bundles patchelf 0.9 (2016). Qt 6.2 and later store a
    # plugin's metadata in an ELF note and locate it by walking the PT_NOTE
    # program headers. When patchelf 0.9 grows .dynstr to hold an RPATH it
    # relocates .note.qt.metadata to the end of the file without extending
    # PT_NOTE coverage, so the note is still in the file but no longer in any
    # NOTE segment. Qt then rejects every plugin with
    #
    #     '...libqxcb.so' is not a Qt plugin (metadata not found)
    #
    # which leaves the app with no platform plugin at all. Note that the
    # damage cannot be repaired afterwards: running a newer patchelf over an
    # already-mangled plugin does not restore the coverage.
    #
    # patchelf 0.18 from the distribution gets this right, so this part opts
    # out of snapcraft's pass (no enable-patchelf, and override-prime
    # suppresses it as well) and sets the RPATH itself, with the same flags
    # snapcraft would have used.
    plugin: nil
    after: [qt]
    build-packages:
      - patchelf  # 0.18 in 26.04; snapcraft's own is 0.9 and unusable here
    stage-packages:
      - python3-pyqt6
      - python3-pyqt6.qtsvg
      - kde-style-breeze
      - qt6-wayland
    stage:
      - usr/lib/*/qt6/plugins
    override-prime: |
      craftctl default
      libdir="usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"
      # Plugins sit at two different depths (platforms/*.so, but also
      # kf6/kwindowsystem/*.so), so derive $ORIGIN's target per file rather
      # than hardcoding one relative path.
      find "$CRAFT_PRIME/$libdir/qt6/plugins" -name '*.so' | while read -r so; do
        rel=$(realpath --relative-to="$(dirname "$so")" "$CRAFT_PRIME/$libdir")
        patchelf --no-default-lib --force-rpath --set-rpath \
          "\$ORIGIN/$rel:/snap/core26/current/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR" "$so"
      done

  git:
    # Bundled so the snap works standalone, even though classic confinement
    # also lets us reach the user's own git.
    plugin: nil
    build-attributes: [enable-patchelf]
    stage-packages:
      - git
      - git-lfs
      - openssh-client

lint:
  ignore:
    # The classic linter flags every staged library for not using the base's
    # loader; patchelf handles that for us.
    - classic
    - library
